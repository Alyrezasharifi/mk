<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Countdown — Recovery</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Inter for english text (google) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <img src="assets/logo.svg" alt="logo" class="logo" />
      <div class="controls">
        <button id="shareBtn" title="اشتراک‌گذاری">SHARE</button>
        <button id="qrBtn" title="QR Code">QR</button>
        <button id="fsBtn" title="تمام صفحه">FULL SCREEN</button>
        <button id="musicBtn" title="پخش/توقف موسیقی">🎵</button>
      </div>
    </header>

    <section class="hero">
      <div class="bg-clouds"></div>
      <div class="card glass">
        <div class="card-left">
          <h2 class="title">Time Remaining Until Mahak's Nose Replacement</h2>
          <p class="subtitle">Forward to a better nose and beyond</p>

          <div class="countdown" aria-live="polite">
            <div class="unit">
              <div class="label">DAYS</div>
              <div class="digits" id="days">00</div>
            </div>
            <div class="separator">:</div>
            <div class="unit">
              <div class="label">HOURS</div>
              <div class="digits" id="hours">00</div>
            </div>
            <div class="separator">:</div>
            <div class="unit">
              <div class="label">MINUTES</div>
              <div class="digits" id="minutes">00</div>
            </div>
            <div class="separator">:</div>
            <div class="unit">
              <div class="label">SECONDS</div>
              <div class="digits flipwrap" id="seconds">00</div>
            </div>
          </div>

          <div class="progress-wrap">
            <div class="progress-info">
              <div class="progress-text">Remaining time</div>
              <div class="progress-percent" id="progressPercent">0%</div>
            </div>
            <div class="progress">
              <div class="progress-bar" id="progressBar" style="width: 5%"></div>
            </div>
          </div>

          <p class="footer-text" id="motivText">One day closer. One smile brighter. 🤍</p>
        </div>

        <div class="card-right">
          <!-- SVG girl -->
          <img src="assets/curly-girl.svg" alt="Curly girl illustration" class="curly" />
        </div>
      </div>

      <footer class="meta">
        <div class="meta-left">
          <small id="countdownUntil">8 Days • 09:00:00</small>
        </div>
        <div class="meta-right">
          <small>🤍</small>
        </div>
      </footer>
    </section>
  </main>

  <!-- hidden audio -->
  <audio id="bgMusic" src="assets/music.mp3" loop crossorigin="anonymous"></audio>

  <!-- QR modal -->
  <div id="qrModal" class="modal hidden">
    <div class="modal-inner glass">
      <button class="close" id="qrClose">✕</button>
      <h3>SHARE QR</h3>
      <img id="qrImg" alt="QR code" src="" />
      <p class="small">می‌توانید این تصویر را ذخیره کنید یا اسکن کنید.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

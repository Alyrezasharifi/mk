<?xml version="1.0" encoding="utf-8"?>
<svg width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cartoon curly girl">
  <defs>
    <linearGradient id="skin" x1="0" x2="1">
      <stop offset="0" stop-color="#FFEFD6"/>
      <stop offset="1" stop-color="#FFD9B4"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="none"/>
  <!-- hair (stylized curls) -->
  <g transform="translate(60,30)">
    <ellipse cx="150" cy="140" rx="120" ry="120" fill="#0b556b" />
    <g fill="#0f6a86">
      <path d="M60 120 q20 -60 80 -70 q40 0 80 36 q30 36 10 90 q-12 30 -50 38 q-60 -10 -100 -16 q-40 -20 -40 -78z" opacity="0.98"/>
    </g>
    <!-- face -->
    <circle cx="150" cy="160" r="64" fill="url(#skin)"/>
    <!-- eyes -->
    <circle cx="130" cy="155" r="6" fill="#1b2a2f"/>
    <circle cx="170" cy="155" r="6" fill="#1b2a2f"/>
    <!-- smile -->
    <path d="M126 178 q24 18 48 0" stroke="#9b5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- sweater -->
    <rect x="90" y="220" width="120" height="80" rx="12" fill="#ffffff" stroke="#dfeffb" stroke-width="2"/>
  </g>
</svg>